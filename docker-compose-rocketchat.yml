version: '3.9'

# Dedicated Docker Compose for Rocket.Chat (used on macOS/Windows for native MentorED setup).
# Linux/Ubuntu users should install Rocket.Chat natively — see the native setup README.

networks:
  rocketchat_net:
    driver: bridge

services:
  rocketchat_mongodb:
    image: mongo:7.0
    container_name: rocketchat_mongodb
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--oplogSize', '128']
    volumes:
      - rocketchat_mongodb_data:/data/db
    networks:
      - rocketchat_net
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            var s = rs.status();
            if (s.ok === 1) quit(0); else quit(1);
          } catch(e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'rocketchat_mongodb:27017' }] });
            quit(1);
          }
        "
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:6.12.0
    container_name: rocketchat
    restart: unless-stopped
    ports:
      - '3969:3000'
    environment:
      ROOT_URL: 'http://localhost:3969'
      PORT: '3000'
      MONGO_URL: 'mongodb://rocketchat_mongodb:27017/rocketchat?replicaSet=rs0'
      MONGO_OPLOG_URL: 'mongodb://rocketchat_mongodb:27017/local?replicaSet=rs0'
      DEPLOY_METHOD: 'docker'
      ADMIN_USERNAME: 'admin'
      ADMIN_PASS: 'Admin@1234'
      ADMIN_EMAIL: 'admin@elevate.local'
    depends_on:
      rocketchat_mongodb:
        condition: service_healthy
    networks:
      - rocketchat_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/info']
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  rocketchat_mongodb_data:
