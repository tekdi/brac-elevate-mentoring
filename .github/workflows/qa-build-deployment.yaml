name: Tag Build & Deploy Mentoring Service (BRAC)

on:
  push:
    tags:
      - "v*"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BRAC }}
  TAG: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # AWS Authentication
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # Login to Amazon ECR
      # ============================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # Setup QEMU
      # Required for ARM64 build on AMD64 GitHub runner
      # ============================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ============================================================
      # Setup Docker Buildx
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Build & Push Multi-Architecture Image
      # ============================================================
      - name: Build and Push Multi-Architecture Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          # Build AMD64 + ARM64
          platforms: linux/amd64,linux/arm64

          # Push directly to ECR
          push: true

          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.TAG }}

          # GitHub Actions BuildKit cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # Deploy on QA Server
      # ============================================================
      - name: Deploy Stack to QA
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_NAME_QA }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ env.AWS_REGION }}

            cd ${{ secrets.TARGET_DIR_QA }}

            # Backup old environment file
            if [ -f .env ]; then
              mv .env .env-bkp
            fi

            # Write QA environment
            cat << 'EOF' > .env
            ${{ secrets.QA_ENV_BRAC }}
            EOF

            # Login to ECR
            aws ecr get-login-password --region ${AWS_REGION} \
              | docker login \
                --username AWS \
                --password-stdin \
                ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com

            # Deploy image
            ./deploy.sh ${{ env.TAG }}
